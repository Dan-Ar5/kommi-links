<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descarga Kommi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #0A0A0A;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .logo span { color: #E5292B; }
  h1 { font-size: 20px; margin: 24px 0 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  a.btn {
    display: block;
    text-decoration: none;
    background: #E5292B;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ko<span>mm</span>i</div>
    <h1>Descarga Kommi</h1>
    <p>Pide tu menú desde el celular y reclama tu regalo de bienvenida.</p>
    <a class="btn" id="download-android" href="#">Descargar en Google Play</a>
    <a class="btn" id="download-ios" href="#">Descargar en App Store</a>
  </div>
  <script>
    // Página del QR de los stickers. Mismos links que PLAY_STORE_URL y
    // APP_STORE_URL en src/constants/app.ts del proyecto y que index.html.
    var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.razeia.kommi';
    var APP_STORE_URL = 'https://apps.apple.com/pe/app/kommi/id6822003785';

    var btnAndroid = document.getElementById('download-android');
    var btnIos = document.getElementById('download-ios');
    btnAndroid.href = PLAY_STORE_URL;
    btnIos.href = APP_STORE_URL;

    // Cada celular va directo a su tienda; en computadora (o si no se
    // reconoce) se quedan los dos botones.
    var ua = navigator.userAgent || '';
    var isIos = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    if (isIos) {
      btnAndroid.style.display = 'none';
      window.location.replace(APP_STORE_URL);
    } else if (isAndroid) {
      btnIos.style.display = 'none';
      window.location.replace(PLAY_STORE_URL);
    }
  </script>
</body>
</html>
