<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Únete a mi Mesa Kommi</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #0A0A0A;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .logo span { color: #E5292B; }
  h1 { font-size: 20px; margin: 24px 0 8px; }
  p { color: #555; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  .code {
    display: inline-block;
    background: #FFFFFF;
    border: 1.5px solid #E5292B;
    border-radius: 14px;
    padding: 14px 28px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #E5292B;
    margin-bottom: 24px;
  }
  a.btn {
    display: block;
    text-decoration: none;
    background: #E5292B;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    padding: 16px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .hint { font-size: 12px; color: #999; margin-top: 24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">ko<span>mm</span>i</div>
    <h1 id="title">Abriendo tu Mesa…</h1>
    <p id="subtitle">Si tienes Kommi instalado, ya debería estar abriéndose.</p>
    <div class="code" id="code">------</div>
    <a class="btn" id="download" href="#">Descargar Kommi</a>
    <p class="hint">Después de instalarla e iniciar sesión, entra a "Buscar Mesa" e ingresa el código de arriba.</p>
  </div>
  <script>
    // Actualizar cada vez que se exporte un build nuevo — mismo valor que
    // LATEST_APK_URL en src/constants/app.ts del proyecto.
    var LATEST_APK_URL = 'https://expo.dev/artifacts/eas/ETtqX3p7xjHRsW7EhyztX_AoF7V8-7nwcDmIen_VQqM.apk';

    var params = new URLSearchParams(window.location.search);
    var code = (params.get('code') || '').replace(/[^0-9]/g, '').slice(0, 6);

    document.getElementById('code').textContent = code || '------';
    document.getElementById('download').href = LATEST_APK_URL;

    if (code) {
      window.location.href = 'kommi://mesa/unirme?code=' + encodeURIComponent(code);
    } else {
      document.getElementById('title').textContent = 'Código no encontrado';
      document.getElementById('subtitle').textContent = 'Pídele a quien te invitó que te comparta el link de nuevo.';
    }
  </script>
</body>
</html>
